<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Doom RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --body:#34373d; --body-hi:#474b53; --body-lo:#24262a;
  --key:#4d525b; --key-hi:#636975; --key-lo:#2b2e33; --ink:#d9dce2; --ink-dim:#9aa0ab;
  --fire:#a8352a; --fire-hi:#c9483a; --glass:#000; --page:#16171a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --page:#c9ccd2; } }
:root[data-theme="light"]{ --page:#c9ccd2; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:"Chakra Petch",system-ui,sans-serif;color:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.phone{height:100%;max-height:900px;width:min(100%,460px);display:flex;flex-direction:column;
  background:linear-gradient(170deg,var(--body-hi),var(--body) 30%,var(--body-lo));
  padding:14px 14px 12px;gap:10px}
@media (min-width:520px){ .phone{height:calc(100% - 32px);border-radius:34px;box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12)} }
.bezel{flex:1 1 auto;min-height:0;background:var(--glass);border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 2px #0a0a0a, inset 0 2px 10px rgba(0,0,0,.8);position:relative}
canvas#screen{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%;max-height:100%;aspect-ratio:176/208;height:100%;width:auto;object-fit:contain}
.overlay{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(0,0,0,.82);font-size:15px;line-height:1.45}
.overlay[hidden]{display:none}
.overlay button{font:inherit;font-weight:700;background:var(--fire);color:#fff;border:0;border-radius:8px;padding:10px 22px;cursor:pointer}
.overlay p{margin:0;max-width:30ch;color:var(--ink-dim)}
.pad{flex:0 0 auto;display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-rows:auto auto;gap:8px 10px}
.soft{display:flex;align-items:flex-start}
.soft.r{justify-content:flex-end}
button.k{font:inherit;font-weight:700;color:var(--ink);background:linear-gradient(var(--key-hi),var(--key));border:0;border-radius:10px;
  box-shadow:0 3px 0 var(--key-lo),0 4px 6px rgba(0,0,0,.35);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
button.k:active,button.k.on{transform:translateY(2px);box-shadow:0 1px 0 var(--key-lo)}
button.k:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.k small{font-weight:500;font-size:10px;color:var(--ink-dim);margin-top:2px}
.soft button{width:100%;height:36px;font-size:13px}
.dpad{grid-row:1/3;grid-column:2;aspect-ratio:1;max-height:150px;justify-self:center;height:100%;min-height:118px;display:grid;grid-template:1fr 1.1fr 1fr/1fr 1.1fr 1fr;gap:3px;
  background:var(--body-lo);border-radius:50%;padding:10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.dpad button{font-size:15px;border-radius:8px}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .f{grid-area:2/2;border-radius:50%;background:linear-gradient(var(--fire-hi),var(--fire));box-shadow:0 3px 0 #5e1d17}
.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.side{display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.side button{height:36px;font-size:12px}
.nums{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px 12px}
.nums button{height:clamp(30px,5.2vh,44px);font-size:17px}
.nums button small{font-size:9.5px}
.meta{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-dim);padding:0 4px}
.meta button{font:inherit;background:none;border:1px solid var(--body-hi);color:var(--ink-dim);border-radius:6px;padding:3px 8px;cursor:pointer}
@media (hover:hover) and (pointer:fine){ .touchonly{display:none} }
@media (max-height:640px){ .nums{display:none} }
</style>
</head>
<body>
<div class="phone">
  <div class="bezel">
    <canvas id="screen" width="176" height="208" aria-label="Doom RPG game screen"></canvas>
    <div class="overlay" id="boot">
      <div style="font-size:20px;font-weight:700">Doom RPG</div>
      <p>The original 2005 J2ME game, running from its own bytecode.</p>
      <button id="start">Power on</button>
      <p style="font-size:12px">Keyboard: arrows move and turn, Enter or Space to act, Q for Menu, E for Map, Z and X to strafe, 1–9 as the phone keypad.</p>
    </div>
    <div class="overlay" id="err" hidden><div id="errmsg"></div><button onclick="location.reload()">Restart</button></div>
  </div>
  <div class="pad">
    <div class="soft"><button class="k" data-code="-6" aria-label="Left soft key (Menu)">Menu</button></div>
    <div class="dpad">
      <button class="k u" data-code="-1" data-rep aria-label="Forward">▲</button>
      <button class="k l" data-code="-3" data-rep aria-label="Turn left">◀</button>
      <button class="k f" data-code="-5" aria-label="Act / fire"></button>
      <button class="k r" data-code="-4" data-rep aria-label="Turn right">▶</button>
      <button class="k d" data-code="-2" data-rep aria-label="Back">▼</button>
    </div>
    <div class="soft r"><button class="k" data-code="-7" aria-label="Right soft key (Map)">Map</button></div>
    <div class="side"><button class="k" data-code="49" data-rep>Strafe ◀</button></div>
    <div class="side"><button class="k" data-code="51" data-rep>Strafe ▶</button></div>
  </div>
  <div class="nums">
    <button class="k" data-code="49">1<small>strafe</small></button>
    <button class="k" data-code="50">2<small>fwd</small></button>
    <button class="k" data-code="51">3<small>strafe</small></button>
    <button class="k" data-code="52">4<small>turn</small></button>
    <button class="k" data-code="53">5<small>act</small></button>
    <button class="k" data-code="54">6<small>turn</small></button>
    <button class="k" data-code="55">7<small>weapon</small></button>
    <button class="k" data-code="56">8<small>back</small></button>
    <button class="k" data-code="57">9<small>pass</small></button>
    <button class="k" data-code="42">✱<small>weapon</small></button>
    <button class="k" data-code="48">0<small>menu</small></button>
    <button class="k" data-code="35">#<small>map</small></button>
  </div>
  <div class="meta"><span>Saves stay in this browser</span><button id="mute" aria-pressed="false">Sound on</button></div>
</div>
